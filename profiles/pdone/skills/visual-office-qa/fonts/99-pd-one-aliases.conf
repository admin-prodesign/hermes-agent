<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Firm runs name Microsoft JhengHei and Aptos. Map them onto faces this image installs. -->
  <alias>
    <family>Microsoft JhengHei</family>
    <prefer><family>Noto Sans CJK TC</family></prefer>
  </alias>
  <alias>
    <family>JhengHei</family>
    <prefer><family>Noto Sans CJK TC</family></prefer>
  </alias>
  <alias>
    <family>微軟正黑體</family>
    <prefer><family>Noto Sans CJK TC</family></prefer>
  </alias>
  <alias>
    <family>Aptos</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
</fontconfig>
